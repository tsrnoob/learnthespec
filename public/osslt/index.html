<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>OSSLT Grammar Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: playful lesson app. Home = big set buttons + grid of rule tiles that zoom open. Quiz = progress bar, one big question, chunky answers, bottom feedback sheet. Light only by design. */
:root{color-scheme:light;--bg:#ffffff;--ink:#283241;--muted:#6f7b8b;--line:#e2e6ec;--line2:#c9d0d9;--pri:#3d6cf2;--pri-d:#2a4fc0;--pri-soft:#e6edff;--good:#2e9e4d;--good-d:#237a3b;--good-soft:#dcf5e1;--bad:#e04848;--bad-d:#b53434;--bad-soft:#fde4e4;--sun:#ffc531;--sun-d:#d99f00;
--t1:#ffe9c2;--t2:#d9f0ff;--t3:#e3f7d6;--t4:#f3e2ff;--t5:#ffe0e6;--font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;font-weight:500;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:18px 24px;gap:18px}
h1{font-size:1.5rem;font-weight:900;margin:0}
h2{font-size:1.05rem;font-weight:800;margin:6px 0 0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);margin:2px 0 0}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--bg);transition:transform .08s}
.big:active,.tile:active,.opt:active,.chip:active,.go:active{transform:translateY(2px)}
.big .ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:1.3rem;color:#fff;background:var(--pri);border-bottom:4px solid var(--pri-d)}
.big.sun .ic{background:var(--sun);border-color:var(--sun-d);color:var(--ink)}
.big b{font-weight:800;font-size:1.1rem;display:block}
.big span{color:var(--muted);font-size:.92rem}
.sets{display:flex;flex-direction:column;gap:12px}
.switch{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.92rem;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--pri)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .08s}
.tile .g{font-weight:900;font-size:1.9rem;line-height:1}
.tile .n{font-weight:800;font-size:.98rem;line-height:1.2}
.tile .n small{display:block;font-weight:700;color:var(--muted);font-size:.8rem}
.tile .ck{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;font-weight:900;font-size:.85rem;display:grid;place-items:center}
.c1{background:var(--t1)}.c2{background:var(--t2)}.c3{background:var(--t3)}.c4{background:var(--t4)}.c5{background:var(--t5)}
.veil{position:fixed;inset:0;background:rgba(40,50,65,.45);opacity:0;transition:opacity .28s;z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.veil.on{opacity:1}
.sheet{width:min(520px,100%);max-height:100%;overflow:auto;border-radius:22px;border:2px solid var(--line);border-bottom-width:6px;padding:22px;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .25s;transform-origin:center}
.sheet .g{font-weight:900;font-size:2.6rem;line-height:1}
.sheet h3{margin:8px 0 2px;font-size:1.35rem;font-weight:900}
.sheet .cn{color:var(--muted);font-weight:700;margin:0 0 12px}
.sheet p{margin:0 0 12px}
.ex{background:var(--bg);border-radius:14px;padding:12px 14px;margin:0 0 10px;font-weight:700}
.ex .x{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;display:block}
.ex .v{color:var(--good);display:block}
.sheet ul{margin:0 0 12px;padding-left:20px}.sheet li{margin:5px 0}
.go{width:100%;padding:14px;border-radius:14px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--pri);border-bottom:5px solid var(--pri-d);transition:transform .08s}
.go:disabled{background:var(--line);border-color:var(--line2);color:var(--muted);cursor:default}
.go.good{background:var(--good);border-color:var(--good-d)}.go.bad{background:var(--bad);border-color:var(--bad-d)}
.go.ghost{background:var(--bg);color:var(--pri);border:2px solid var(--line);border-bottom-width:5px}
.top{display:flex;align-items:center;gap:14px}
.x-btn{font-size:1.5rem;font-weight:900;color:var(--muted);width:40px;height:40px;border-radius:10px}
.prog{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .35s;box-shadow:inset 0 4px 0 rgba(255,255,255,.3)}
.cnt{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.q{flex:1;display:flex;flex-direction:column;gap:16px;animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(var(--dx,24px))}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.instr{font-size:1.3rem;font-weight:900;margin:0;text-wrap:balance}
.para{white-space:pre-line;background:#f5f7fa;border-radius:14px;padding:12px 14px;margin:0}
.stem{font-size:1.2rem;font-weight:700;margin:0;line-height:2.2}
.slot{display:inline-block;min-width:74px;text-align:center;border-bottom:3px solid var(--line2);padding:0 8px;margin:0 3px;color:var(--pri);font-weight:800;line-height:1.5}
.slot.right{color:var(--good);border-color:var(--good)}.slot.wrong{color:var(--bad);border-color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--bg);font-weight:700;transition:transform .08s}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem;color:var(--muted)}
.opt.sel{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-d)}.opt.sel .k{border-color:var(--pri);color:var(--pri)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good-d);animation:pop .3s}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-d);animation:shake .35s}
.blank{display:flex;flex-direction:column;gap:6px}
.blank label{font-weight:800;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;font-weight:800;background:var(--bg);transition:transform .08s}
.chip.sel{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-d)}
.foot{position:sticky;bottom:0;margin:0 -16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.foot.ok{background:var(--good-soft);border-color:var(--good-soft)}.foot.no{background:var(--bad-soft);border-color:var(--bad-soft)}
.foot .msg{font-weight:900;font-size:1.15rem;margin:0 0 2px}
.foot.ok .msg{color:var(--good-d)}.foot.no .msg{color:var(--bad-d)}
.foot .ans{margin:0 0 10px;font-weight:700}
.foot.no .ans{color:var(--bad-d)}.foot.ok .ans{color:var(--good-d)}
.res{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:2.2rem;animation:pop .45s;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:118px;height:118px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.rev{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.rv{border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.rv.no{border-color:var(--bad);background:var(--bad-soft)}
.rv b{font-weight:800}.rv .v{color:var(--good-d);font-weight:800}.rv .x{color:var(--bad-d);font-weight:700;text-decoration:line-through}
.rv small{color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:stretch}.row .go{flex:1}
.arr{flex:none;width:54px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--bg);font-size:1.1rem;color:var(--pri);font-weight:900}
.arr:disabled{color:var(--line2);cursor:default}
.pass{border:2px solid var(--line);border-radius:14px;background:#f7f9fc}
.pass summary{padding:10px 14px;font-weight:800;cursor:pointer}.pass summary small{color:var(--muted);font-weight:700;margin-left:6px}
.ptxt{max-height:38vh;overflow:auto;padding:0 14px 6px;font-size:.98rem;border-top:2px solid var(--line)}.ptxt p{margin:10px 0}
.sheet.menu{background:var(--bg)}
.mh{font-weight:800;color:var(--muted);font-size:.85rem;margin:12px 0 6px}
.mg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dot{width:42px;height:42px;border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--bg)}
.dot.done{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-d)}.dot.ok{background:var(--good-soft);border-color:var(--good);color:var(--good-d)}.dot.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-d)}
.dot.cur{outline:3px solid var(--ink);outline-offset:2px}
.leg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.85rem;font-weight:700;margin:14px 0}.leg .dot{width:18px;height:18px;border-radius:5px;border-bottom-width:2px;display:inline-block}
body{margin:0}[hidden]{display:none!important}
/* --- added: practice-test sets (word bank, true/false grid, written answers, text list) --- */
:root{--soft:#f5f7fa}
.big .bw{flex:1;min-width:0}
.big .bst,.trow .bst{flex:none;font-weight:800;font-size:.8rem;color:var(--good-d);background:var(--good-soft);border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.top h1{flex:1;min-width:0}
.src{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0}
.note,.hint{font-size:.9rem;color:var(--muted);font-weight:700;margin:0}
.qb{display:flex;flex-direction:column;gap:16px;min-width:0}
button.slot{vertical-align:baseline;max-width:100%;border-bottom:3px solid var(--line2);border-radius:8px 8px 0 0;color:var(--pri);font-weight:800}
button.slot.act{border-color:var(--pri);background:var(--pri-soft)}
button.slot.right{color:var(--good);border-color:var(--good)}button.slot.wrong{color:var(--bad);border-color:var(--bad)}
.chip{max-width:100%}
.chip.used{opacity:.35;cursor:default}
.chip.right{background:var(--good-soft);border-color:var(--good);color:var(--good-d)}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-d)}
.chip:disabled{cursor:default}
.chips.long{flex-direction:column;align-items:stretch}.chips.long .chip{text-align:left;font-weight:700}
.boxes,.grid,.tlist{display:flex;flex-direction:column;gap:10px}
.bx{display:flex;flex-direction:column;gap:4px}
.bl{font-weight:800;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
.bt{display:block;width:100%;min-height:48px;text-align:left;padding:10px 14px;border-radius:12px;border:2px dashed var(--line2);font-weight:700;background:var(--bg)}
.bt.act{border-color:var(--pri);background:var(--pri-soft)}
.bt.full{border-style:solid;border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.bt.fixd{border-style:solid;border-color:var(--line);background:var(--soft)}
.bt.right{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good-d)}
.bt.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--bad-d)}
.gr{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:2px solid var(--line);border-radius:14px}
.gs{margin:0;font-weight:700}
.key{border:2px solid var(--good);background:var(--good-soft);color:var(--good-d);border-radius:14px;padding:10px 14px;font-weight:700}
.key b{display:block;font-weight:900}
.ta{display:block;width:100%;font:inherit;color:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line2);background:var(--bg);resize:vertical;min-height:150px}
.wc{margin:0;color:var(--muted);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.foot{max-height:70vh;overflow:auto}
.foot .ans{margin:0 0 4px}
.why{margin:0 0 10px;font-size:.92rem;font-weight:700;color:var(--muted)}
.foot.no .why{color:var(--bad-d)}
.foot .ans+.row,.foot .msg+.row{margin-top:10px}
.trow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);transition:transform .08s}
.trow:active{transform:translateY(2px)}
.trow .tt{flex:1;min-width:0}.trow b{display:block;font-weight:800}.trow .tt span{color:var(--muted);font-size:.88rem}
.fine,.cred{color:var(--muted);font-size:.85rem;margin:0}
.ptxt .cred{margin:10px 0}
.rq{color:var(--muted);font-weight:700}
.rv .mine{font-weight:500}
.big .ic{width:auto;min-width:76px;height:auto;padding:7px 8px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.big .ic b{font-weight:900;font-size:1.35rem;display:block;color:inherit}
.big .ic small{font-weight:800;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;align-items:center;gap:8px;min-width:0;text-align:left;padding:11px 12px 11px 14px;border-radius:14px;border:2px solid rgba(40,50,65,.14);border-bottom-width:4px;transition:transform .08s}
.mini:active{transform:translateY(2px)}
.mini .mw{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mini b{font-weight:800}.mini .mw span{color:var(--muted);font-size:.85rem;font-weight:700}
.mini .mgo{flex:none;font-weight:900;font-size:.82rem;color:var(--pri-d);white-space:nowrap}
.mini.a{background:var(--t2)}.mini.b{background:var(--t4)}.mini.c{background:var(--t1);grid-column:1/-1}
.hrow{display:flex;align-items:baseline;gap:10px}.hrow span{flex:1;min-width:0}
.lnk{flex:none;font-size:.8rem;font-weight:800;color:var(--pri);text-transform:none;letter-spacing:0;text-decoration:underline}
.zh{margin:0 0 10px;font-size:.95rem;font-weight:500;line-height:1.6}
.sheet .zh{background:rgba(255,255,255,.65);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.foot .zh{font-weight:700}.foot.ok .zh{color:var(--good-d)}.foot.no .zh{color:var(--bad-d)}
.switch{align-items:flex-start}
@media (min-width:980px){
 #app.rd{max-width:1160px}
 #app.rd .q{flex-direction:row;align-items:flex-start;gap:28px}
 #app.rd .pass{flex:1 1 0;min-width:0;position:sticky;top:12px}
 #app.rd .qb{flex:1 1 0}
 #app.rd .ptxt{max-height:calc(100vh - 220px)}
}
body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<div id="app"></div>
<div id="veil" class="veil" hidden></div>
<div id="menu" class="veil" hidden></div>
<script>
const M=(q,o,a,r,p)=>({t:'mc',q,o,a,r,p});
const SETS={
warm:[
 {t:'dd',q:'Choose the answers that best complete the sentences.',parts:['Last night, Priya ',{o:['finishes','finished','is finishing'],a:1},' her essay. Then she ',{o:['goes','went','is going'],a:1},' to bed.'],r:'Time word "last night" = past tense'},
 M('Choose the word that best completes the sentence.\nEach of the players ___ a uniform.',['has','have','are having','were'],0,'"Each" is singular = has'),
 M('Choose the sentence that is written correctly.',['The store was closed, we went home.','The store was closed we went home.','The store was closed, so we went home.','The store was closed so, we went home.'],2,'Two full sentences need comma + so/and/but'),
 M('Choose the answer that best completes the sentence.\n___, he missed the first class.',['The bus was late','Because the bus was late','The bus being late and'],1,'"Because" clause + comma + main sentence'),
 {t:'dd',q:'Choose the three answers that best complete the sentence.',parts:['We can walk to the park ',{o:['and','or','but','so'],a:1},' take the bus, ',{o:['and','or','but','so'],a:2},' we must leave soon ',{o:['and','or','but','so'],a:3},' we arrive before dark.'],r:'or = choice, but = contrast, so = result'},
 M('Choose the word that best completes the sentence.\nNeither the students ___ the teacher knew the answer.',['or','nor','and','but'],1,'Pair: neither ... nor'),
 M('Choose the sentence that is written correctly.',['I packed three things a hat, sunscreen and water.','I packed three things: a hat, sunscreen and water.','I packed three: things a hat, sunscreen and water.','I packed three things a hat: sunscreen and water.'],1,'Colon after a full sentence, before a list'),
 M('Choose the best way to combine the following sentences.\nJamal was hungry. He made a sandwich.',['Jamal was hungry, he made a sandwich.','Jamal was hungry, so he made a sandwich.','Jamal was hungry, but he made a sandwich.','Jamal was hungry or he made a sandwich.'],1,'Cause then result = so'),
 {t:'dd',q:'Choose the answers that best complete the sentence.',parts:['',{o:["It's",'Its'],a:0},' too late to change ',{o:["it's",'its'],a:1},' name.'],r:"it's = it is; its = belongs to it"},
 M('Which sentence has a mistake?',["The children's coats are in the hall.","My brother's bike is new.","The two dog's bowls are empty.","Sara's phone is on the desk."],2,"Two dogs own the bowls = dogs'")
],
prac:[
 M('Choose the word that best completes the sentence.\nMy sister and I ___ to the same school.',['go','goes','going','has gone'],0,'Two people = plural verb'),
 {t:'dd',q:'Choose the answers that best complete the sentence.',parts:['When the rain ',{o:['stops','stopped','will stop'],a:1},', we ',{o:['go','went','will go'],a:1},' outside and played soccer.'],r:'"played" shows past tense'},
 M('Choose the sentence that is written correctly.',['I finished my homework, then I watched a movie.','I finished my homework then, I watched a movie.','I finished my homework, and then I watched a movie.','I finished my homework and, then I watched a movie.'],2,'Comma + and joins two full sentences'),
 M('Choose the word that best completes the sentence.\n___ Leo studied all week, he felt ready for the test.',['Because','Although','Unless','But'],0,'Studying is the reason = because'),
 M('Choose the words that best complete the sentence.\nShe speaks not only English ___ French.',['but also','and also','or','nor'],0,'Pair: not only ... but also'),
 M('Choose the sentence that is written correctly.',["Their going to there cottage this weekend.","There going to their cottage this weekend.","They're going to their cottage this weekend.","They're going to there cottage this weekend."],2,"they're = they are; their = belongs to them"),
 M('Choose the best way to combine the following sentences.\nThe library is quiet. It is a good place to study.',['The library is quiet, it is a good place to study.','The library is quiet, but it is a good place to study.','Because the library is quiet, it is a good place to study.','The library is quiet because it is a good place to study.'],2,'Quiet is the reason; D reverses cause and effect'),
 M('Choose the word that best completes the sentence.\nThe coach told us to stretch, ___ and drink water.',['jogging','to jogging','jog','we jog'],2,'Parallel: stretch, jog, drink'),
 M('Choose the word that best completes the sentence.\nThe teacher gave the books to Maya and ___.',['I','me','myself','mine'],1,'After "to" use me (gave the books to me)'),
 M('Choose the word that best completes the sentence.\nThis is the ___ movie I have ever seen.',['most funniest','funnier','funniest','more funny'],2,'"the ... ever" = superlative, only one -est'),
 M('Choose the word that best completes the sentence.\nI should have ___ earlier.',['went','gone','go','going'],1,'have + past participle (gone)'),
 M('Choose the answer that best completes the sentence.\nMy family ___ in Toronto since 2020.',['lives','has lived','is living','live'],1,'"since" = has/have + past participle'),
 {t:'multi',q:'Select TWO sentences that are written correctly.',o:['The dog wagged its tail.','Me and him went to the store.','There are three apples on the table.',"She don't like spicy food.",'We was late for class.'],a:[0,2],r:'Others: He and I went; She doesn\'t; We were'},
 M('Choose the answer that best completes the sentences.\nThe team practised every day. ___, they won the championship.',['However','As a result','For example','Instead'],1,'Second sentence is the result'),

const PASS=[{"title": "Small Insects, Important Work", "kind": "Information text", "paras": ["[1] Animal waste may not seem useful, but for dung beetles, it is a valuable resource. These insects collect waste, shape it into balls and move it away. Some bury it underground, where it becomes food for themselves and their young. To a person walking through a field, a ball of waste might appear to be something worth avoiding. To the beetle, however, it represents a meal and a place to provide for the next generation. Collecting and moving it requires considerable effort, especially across rough ground.", "[2] Moving a ball in a straight line helps a beetle escape quickly from other beetles that might steal it. However, keeping a straight path is difficult when the insect is pushing backwards and cannot easily see where it is going. Every extra turn can bring the beetle back toward a crowded feeding place. Small stones, grass stems and uneven soil make the journey harder. A short, direct route reduces the time spent near rivals. This explains why finding a direction matters even when the insect has no distant nest to reach.", "[3] Researchers studying certain dung beetles discovered that the insects could use the night sky to find their way. Under a clear sky, the beetles travelled along fairly straight paths. When their view of the sky was blocked, they wandered instead. Patterns of light in the sky helped guide them. The researchers did not simply watch one successful journey and assume they understood it. They compared behaviour under different conditions. The important difference was whether the insects could see the sky. Such comparisons help scientists distinguish a useful explanation from a guess. The findings concerned the beetles studied; they did not establish that every insect uses the same method.", "[4] Dung beetles also benefit the environment. By burying animal waste, they return nutrients to the soil. Their tunnels allow air and water to enter the ground. Removing waste also leaves fewer places for some flies to lay their eggs. These benefits connect the beetles' daily activities with the health of a larger system. Nutrients do not remain locked inside waste on the surface. Instead, the insects move some of that material into the ground. Other living things can benefit even though the beetles are acting to meet their own needs rather than deliberately helping plants or farmers.", "[5] These insects are easy to overlook because of their size and unusual diet. Yet their work shows that even an animal with an unpleasant job can play an important role in nature. Their example also challenges the way people judge animals. Colourful birds and large mammals often attract attention immediately, while small creatures working close to the soil receive little notice. Looking more carefully reveals a different picture. An animal does not need to be attractive, familiar or large to have effects that extend well beyond its own life."]}, {"title": "Campus Repair Hub Gets Students Moving", "kind": "News report", "paras": ["[1] NORTHFIELD - Students at Northfield University opened a bicycle repair hub on Monday to help classmates keep their bicycles safe and affordable to use. The room is small, with two repair stands and shelves of labelled equipment, but the organizers hope its impact will reach beyond the bicycles brought through its door. They want students who depend on cycling to feel confident about maintaining their transportation.", "[2] The project began when student Maya Chen noticed several bicycles sitting unused outside her residence. \"One had a flat tire. Another had a loose chain,\" she said. \"Their owners wanted to ride, but they did not know how to fix them.\" When she spoke to the owners, she discovered that some had postponed repairs for weeks. They were uncertain about which tools to buy or where to begin. Maya realized that access to equipment alone would not solve the problem; beginners also needed someone willing to guide them.", "[3] Maya and eight volunteers asked the university for an unused storage room. A local bicycle shop donated tools, and a university sustainability fund provided $2,000 for equipment. After completing safety training, the volunteers began offering basic repairs. Preparing the space took several weekends. The volunteers cleaned the room, organized supplies and agreed on a system for recording visits. They also discussed how to explain repairs clearly to people who had never used the equipment. Their aim was to create a welcoming learning space rather than a place where beginners felt embarrassed.", "[4] Students can use the hub's tools for free, although they must pay for any new parts. Volunteers explain each step and encourage bicycle owners to help. \"If we do everything for them, they leave with a working bicycle,\" Maya explained. \"If we teach them, they leave with a skill as well.\" A typical visit begins with the owner describing the problem. The volunteer then checks whether it is suitable for the hub and explains what the repair may involve. Owners are encouraged to ask questions before trying a step themselves. Working this way sometimes takes longer, but the organizers consider the learning part essential.", "[5] During its first week, the hub helped 34 riders. One was first-year student Daniel Ross, who had been taking the bus because of a flat tire. With a volunteer's guidance, he replaced the inner tube himself. \"Next time, I'll know where to start,\" he said. Daniel admitted that he had expected to stand aside while someone else completed the job. Instead, he learned the names of the tools and practised the repair with help nearby. He plans to return for a workshop, even if his bicycle is still working, because he wants to understand routine maintenance.", "[6] The hub cannot handle every problem. Bicycles with damaged frames or complicated mechanical issues are referred to professional repair shops. Volunteers say recognizing their limits is part of keeping riders safe. The service does not promise that every bicycle can be repaired during one visit. When volunteers are uncertain, they explain the concern and recommend qualified help. Maya says students should leave knowing both what they can attempt and when they should seek additional assistance.", "[7] The team plans to offer evening workshops next term. Its goal is to make bicycle maintenance a regular part of campus life. Organizers will review common questions from the first term before choosing workshop topics. They hope students who learn a skill will eventually share it with others, allowing the small room to support a growing community of riders."]}, {"title": "A Different Kind of Portrait", "kind": "Narrative", "paras": ["[1] When Lena was invited to display a painting at the community centre, she immediately imagined a detailed portrait of her grandmother. She spent several evenings trying to make every feature accurate. Still, something about the painting felt empty. She had chosen a photograph with clear lighting and carefully measured the distance between the eyes. Each evening, she compared the painted face with the photograph. Friends said the resemblance was strong, yet Lena felt that the canvas could have belonged to someone she barely knew.", "[2] \"The eyes are the right shape,\" Lena told her art teacher, Mr. Patel, \"but it doesn't feel like her.\" She expected him to point out an incorrect proportion or suggest a different brush. Technical problems usually seemed easier to solve because there was something definite to measure. This time, she could not explain exactly what needed changing, and that uncertainty made her hesitate.", "[3] Instead of suggesting another drawing exercise, Mr. Patel asked a question: \"What do you notice first when you think about your grandmother?\" Lena did not answer immediately. At first she pictured her grandmother's face, just as it appeared in the photograph. Then she began thinking about movement, sound and familiar routines. Mr. Patel waited rather than supplying an answer, giving her time to move beyond the image she had already chosen.", "[4] Lena thought about the kitchen table covered with fabric, the quick movement of her grandmother's hands and the stories she told while sewing. That evening, Lena put her portrait aside. She began a new painting of two hands holding a piece of bright blue cloth. The cloth reminded her of afternoons spent choosing fabric for family celebrations. Her grandmother would let her arrange the pieces, even when the colours did not match. Painting the hands seemed less obvious than painting a face, but it connected with experiences that belonged specifically to their relationship.", "[5] The new work was difficult. Lena repeatedly changed the shadows, and once she nearly painted over the entire canvas. Her grandmother offered to sit beside her while she worked. As they talked, Lena noticed a small scar on one finger - a detail she had never included in earlier sketches. The scar changed the way she looked at the subject. Instead of trying to produce perfectly smooth skin, she began noticing marks, folds and uneven nails. These details suggested years of work. She still wanted the hands to look believable, but she now understood why accuracy mattered: it could help communicate a particular person's life.", "[6] At the exhibition, Lena worried that visitors would prefer paintings of faces. Then a woman stopped in front of her canvas. \"My mother used to sew,\" the woman said quietly. Soon, she was telling Lena about the clothes her mother had made for her. Lena had prepared an explanation of her painting, but she did not need to deliver it. The woman had found her own way into the image. As Lena listened, her worry about whether the subject counted as a portrait began to fade. The painting had started a conversation she had not expected.", "[7] By the end of the afternoon, several visitors had shared similar memories. Lena looked across the room at her grandmother, who was smiling. For the first time, she understood that a portrait could show who someone was without showing their face. She thought again about the first canvas waiting at home. It had taught her to observe a face carefully. The second had taught her to ask what she wanted another person to understand. Both required attention, but only one had begun with the memories she most wanted to share."]}, {"title": "Burgess Shale: A Window into Ancient Life", "kind": "Information text", "paras": ["[1] High in the Canadian Rocky Mountains in British Columbia, layers of rock hold evidence of an ancient sea. The Burgess Shale contains fossils of marine animals that lived more than 500 million years ago, long before dinosaurs appeared. Although the fossils are now found in mountains, the animals once lived underwater. This contrast between the present landscape and the ancient habitat can surprise visitors. A mountain location does not mean the animals were mountain creatures. The rock records conditions from a much earlier time, so understanding a fossil requires looking beyond the surroundings a visitor sees today.", "[2] Many familiar fossils preserve hard parts such as shells, bones or teeth. Soft tissues usually decay before they can become fossils. The Burgess Shale is unusual because it preserves delicate body features as well. Some specimens reveal eyes, digestive systems and other structures that are rarely visible in the fossil record. Without such preservation, a community made up of many kinds of animals could appear to contain only those with durable outer coverings. That would be like describing a room after most of its contents had been removed. The remaining objects might be real, but the picture would still be incomplete.", "[3] This exceptional preservation gives scientists a fuller picture of ancient life. Looking only at hard parts would leave many soft-bodied animals out of the story. By studying their shapes and body structures, researchers can investigate how these animals lived and compare them with other organisms. Researchers use visible features as evidence rather than treating an unfamiliar shape as a complete answer. A structure may suggest how an animal moved or obtained food, but interpretations need careful comparison. New specimens can reveal details that were missing before and lead scientists to reconsider an earlier explanation.", "[4] The fossils are also useful for understanding ancient communities. Scientists examine different specimens together to explore the variety of animals that shared an environment. A single fossil offers one clue; many carefully recorded fossils allow researchers to ask broader questions about life in an ancient sea. Recording specimens systematically makes these comparisons more useful. Researchers can examine similarities and differences instead of relying on the most striking example. The goal is not simply to collect unusual shapes. It is to assemble evidence that can support explanations about organisms and their relationships within a past environment.", "[5] Where a fossil is found matters too. Its position within a rock layer helps researchers understand its context. Removing a specimen without recording its location can separate it from information that makes it scientifically useful. A fossil is therefore more than an interesting object to display. A label describing a specimen's original location may look less impressive than the fossil itself, yet it helps connect the object to other discoveries. Good records allow later researchers to revisit questions and compare findings. Protecting a site therefore preserves possibilities for future research as well as objects already recognized as important.", "[6] Parks Canada offers guided hikes to Burgess Shale fossil sites. These visits let people learn about the fossils while supporting their protection. The greatest value of the rocks lies in the evidence they hold: they allow people to investigate a world that disappeared hundreds of millions of years ago. For learners, the site also demonstrates how scientific knowledge develops. Questions begin with observations, and explanations must remain connected to evidence. The fossils cannot tell their own stories in words; people interpret the traces they leave. Careful study and protection help ensure that those traces remain available for the next generation of questions."]}, {"title": "A Reading Partner with Four Paws", "kind": "Dialogue", "paras": ["[1] The following conversation takes place at a community library. A volunteer, Sam, and a librarian, Ms. Ali, are discussing a supervised reading program with a trained dog named Maple. Sam has prepared a table where participants can choose books. He is enthusiastic about helping but is unsure how a dog fits into the library's reading activities. Ms. Ali is checking the schedule before the first family arrives.", "[2] SAM: I thought Maple was coming for a demonstration. Why have you put a chair and a pile of books beside her mat? I assumed everyone would gather around while the handler explained what she could do. I brought extra chairs because I thought we would have a big audience.", "[3] MS. ALI: Children will read aloud to her. Maple and her handler have been assessed for visits like this. The handler will stay beside her throughout each session. Each child can choose a book from the table, and an adult will be nearby to help. We have arranged the area away from the busiest entrance so there will be fewer interruptions during reading.", "[4] SAM: But a dog cannot explain an unfamiliar word. Wouldn't reading to an adult be more useful? When I help at homework club, children often want to know whether they have said something correctly. I do not want families to think we are offering support that we cannot actually provide.", "[5] MS. ALI: We still help with unfamiliar words. This program offers something different. Some children worry about making mistakes in front of people. Maple listens without interrupting. We hope that helps them feel comfortable enough to practise. We should explain that clearly to families. A session is an extra opportunity to use reading skills, not a replacement for instruction. A child can pause, try a sentence again or ask an adult for help without having a whole group waiting.", "[6] SAM: Yesterday a boy asked me to read every page for him. Maybe he was worried, rather than uninterested. He kept turning the book toward me before he had tried a sentence. I wondered whether the story was too difficult, but he told me he had chosen it himself. I probably should have asked what kind of help he wanted.", "[7] MS. ALI: That is possible, but we should ask him instead of deciding for him. He can choose whether to join. We also have quiet reading sessions without a dog for anyone who prefers them. Some children enjoy an audience, and others prefer privacy. There is no single arrangement that suits everyone. Giving them a choice helps us offer support that responds to the person in front of us.", "[8] SAM: Could I invite the whole after-school group to read to Maple at once? That would make it possible for everyone to participate today. But perhaps all those voices would make the session feel more like a performance than relaxed practice.", "[9] MS. ALI: Let's begin with one reader at a time and short sessions. The handler will watch Maple and give her breaks. Keeping the experience comfortable for the dog matters too. We can offer more appointments later if there is interest. Starting carefully will help us notice what works before we expand. A busy program is not automatically a successful one if the experience is uncomfortable.", "[10] SAM: How will we know whether the program helps? Counting visitors would tell us how popular it is, but not whether children feel more confident. A large crowd might look impressive in a photograph. Still, if readers leave feeling just as nervous, we would need to rethink how the sessions are organized.", "[11] MS. ALI: Exactly. We can ask participants how they felt before and after reading, and whether they would like to read aloud again. Their answers will help us improve the program. We should also listen when someone says the activity was not helpful. That feedback can tell us whether to change the space, the session length or the choices we offer. Improvement begins with paying attention.", "[12] SAM: I understand now. Maple is not replacing a teacher. She is giving some children a reason to open a book. I will welcome the families and explain the choices before asking anyone to sign up. And I will keep the extra chairs nearby rather than filling this quiet corner with an audience."]}];
SETS.read=[{"ps": 0, "q": "What is the main idea of the selection?", "o": ["Dung beetles need protection from all other insects.", "Dung beetles have useful abilities and help the environment.", "Animal waste prevents plants from growing.", "Researchers teach beetles to travel at night."], "r": "Only B covers the whole text: navigation (P2-3) + environment (P4).", "t": "mc", "a": 1}, {"ps": 0, "q": "Why does moving in a straight line help a dung beetle?", "o": ["It helps the beetle escape competitors that might steal its food.", "It helps the beetle find underground water.", "It makes the ball larger.", "It prevents the beetle from moving backwards."], "r": "P2: straight line helps escape beetles \"that might steal it\".", "t": "mc", "a": 0}, {"ps": 0, "q": "What does \"resource\" mean in paragraph 1?", "o": ["A dangerous obstacle", "A useful supply", "An unusual discovery", "A protected location"], "r": "P1: waste = food for them and their young = useful supply.", "t": "mc", "a": 1}, {"ps": 0, "q": "Which observation supports the researchers' conclusion?", "o": ["Beetles dug tunnels during the day.", "Beetles collected different amounts of waste.", "Beetles wandered when their view of the sky was blocked.", "Beetles travelled faster near other insects."], "r": "P3: sky blocked -> they wandered. That comparison is the proof.", "t": "mc", "a": 2}, {"ps": 0, "q": "Select TWO environmental benefits described in the selection.", "o": ["Returning nutrients to soil", "Preventing all insects from laying eggs", "Allowing air and water into the ground", "Producing light for other animals", "Removing the need for rain"], "r": "Both stated in P4. B says \"all insects\" (too strong).", "t": "multi", "a": [0, 2]}, {"ps": 0, "q": "Why does the writer mention \"an unpleasant job\" at the end?", "o": ["To discourage scientific research", "To suggest beetles need a different diet", "To emphasize that something people dislike can still be valuable", "To compare the sizes of insects"] ining -> 34 riders."}, {"ps": 2, "q": "What is Lena's main problem at the beginning?", "o": ["She has no time to paint.", "Her accurate portrait does not express her grandmother's character.", "Her grandmother refuses to be painted.", "She does not know where the exhibition is."], "r": "P1: accurate (\"resemblance was strong\") but \"felt empty\".", "t": "mc", "a": 1}, {"ps": 2, "q": "How does Mr. Patel help Lena?", "o": ["He paints the difficult parts.", "He tells her to copy another artist.", "He asks a question that helps her reconsider her subject.", "He cancels her exhibition."], "r": "P3: \"Instead of suggesting another drawing exercise, Mr. Patel asked a question.\"", "t": "mc", "a": 2}, {"ps": 2, "q": "What can the reader infer from paragraph 5?", "o": ["Lena finishes without difficulty.", "Time with her grandmother helps Lena notice meaningful details.", "Her grandmother wants her to stop.", "The scar prevents her grandmother from sewing."], "r": "P5: talking with grandmother, she notices the scar.", "t": "mc", "a": 1}, {"ps": 2, "q": "Why does the writer include the visitor's comment?", "o": ["To show the painting creates a personal connection", "To prove all visitors dislike faces", "To reveal the painting's price", "To suggest Lena painted the wrong person"], "r": "P6: the visitor shares her own memory = personal connection.", "t": "mc", "a": 0}, {"ps": 2, "q": "Which word best describes Lena while she works on the second painting?", "o": ["Careless", "Uninterested", "Persistent", "Dishonest"], "r": "P5: keeps changing shadows, does not give up = persistent.", "t": "mc", "a": 2}, {"ps": 2, "q": "Which statement best expresses the central message?", "o": ["Artists should never paint faces.", "A meaningful portrait can communicate more than physical appearance.", "Art can be understood only by the artist's friends.", "Accuracy requires no emotional understanding."], "r": "P7: a portrait can show who someone is without the face.", "t": "mc", "a": 1}, {"ps": 3, "q": "What is the main idea of the selection?", "o": ["Burgess Shale is mainly valuable as a building material.", "Burgess Shale fossils provide important evidence about ancient marine life.", "All fossils preserve the same body structures.", "Dinosaurs once lived in the Burgess Shale sea."], "r": "Every paragraph = what the fossils tell us. D trap: \"long before dinosaurs\".", "t": "mc", "a": 1}, {"ps": 3, "q": "Why is the preservation described in paragraph 2 unusual?", "o": ["It includes soft body structures that usually decay.", "It includes only teeth and bones.", "It proves the animals lived on mountain peaks.", "It makes the animals look like dinosaurs."], "r": "P2: soft tissues usually decay; here they are kept.", "t": "mc", "a": 0}, {"ps": 3, "q": "What does \"context\" mean in paragraph 5?", "o": ["The price paid for an object", "The conditions and information surrounding a discovery", "The colour of a display case", "The size of a visitor group"], "r": "P5: position in the rock = information around the find.", "t": "mc", "a": 1}, {"ps": 3, "q": "What is the purpose of comparing a single fossil with many recorded fossils in paragraph 4?", "o": ["To show that individual fossils have no value", "To explain how combined evidence supports wider investigations", "To suggest every fossil belongs to the same species", "To prove that recording locations wastes time"], "r": "P4: one fossil = one clue; many = broader questions.", "t": "mc", "a": 1}, {"ps": 3, "q": "Select TWO research uses supported by the selection.", "o": ["Investigating the structures of ancient animals", "Predicting the exact date of the next earthquake", "Exploring the variety of animals in an ancient environment", "Proving all ancient animals had shells", "Measuring the height of living dinosaurs"], "r": "P3 body structures; P4 variety of animals. Others not in text.", "t": "multi", "a": [0, 2]}, {"ps": 3, "q": "Which conclusion is best supported by paragraph 5?", "o": ["A fossil's scientific value depends partly on information about where it was found.", "Every removed fossil becomes completely worthless.", "Scientists need only attractive specimens.", "The rock layer matters less than the display case."], "r": "P5: location info makes it useful. B \"completely worthless\" too strong.", "t": "mc", "a": 0}, {"ps": 4, "q": "What is Sam's main concern at first?", "o": ["The books are too heavy.", "A dog cannot provide the same reading help as an adult.", "The library has no chairs.", "The handler will leave Maple alone."], "r": "P4: \"a dog cannot explain an unfamiliar word\".", "t": "mc", "a": 1}, {"ps": 4, "q": "What does Ms. Ali suggest may help nervous readers?", "o": ["Having their mistakes announced to a group", "Choosing only books without unfamiliar words", "Reading to a listener who does not interrupt", "Avoiding all reading practice"], "r": "P5: \"Maple listens without interrupting.\"", "t": "mc", "a": 2}, {"ps": 4, "q": "Why does Ms. Ali say they should ask the boy?", "o": ["To respect his preferences instead of assuming what he needs", "To require him to join the program", "To prove Sam is a poor volunteer", "To persuade him to become a dog handler"], "r": "P7: \"ask him instead of deciding for him\".", "t": "mc", "a": 0}, {"ps": 4, "q": "Select TWO measures intended to keep Maple comfortable.", "o": ["Short reading sessions", "A whole group reading at once", "Breaks monitored by her handler", "Sessions without supervision", "Continuous reading throughout the day"], "r": "P9: short sessions + handler gives breaks.", "t": "multi", "a": [0, 2]}, {"ps": 4, "q": "What does Sam's final comment show?", "o": ["He thinks teachers are no longer necessary.", "He now understands the program's purpose.", "He wants to cancel the program.", "He believes Maple can explain every word."], "r": "P12: \"I understand now.\" His view changed.", "t": "mc", "a": 1}, {"ps": 4, "q": "Which evidence would best show whether the program meets its stated goal?", "o": [ {g:'?',n:'What they ask',cn:'题型',h:`<ul><li><b>Fill the blank</b> with the right word or verb.</li><li><b>Choose the sentence</b> that is written correctly.</li><li><b>Combine sentences</b> the best way.</li><li><b>Complete the sentence</b> with the right clause.</li><li><b>Organize a paragraph</b>: best opening sentence, or the sentence that does not belong.</li></ul>`},
{g:'ed',n:'Tense',cn:'时态',h:`<p>Find the <b>time word</b> first. It decides the verb.</p><div class="ex"><span class="x">Yesterday she walks home.</span><span class="v">Yesterday she walked home.</span></div><p>yesterday, last week = past · every day = present · tomorrow = will · since 2020 = has/have + verb</p>`},
{g:'s',n:'Subject and verb',cn:'主谓一致',h:`<p>The verb matches the <b>real subject</b>. Ignore the words in between.</p><div class="ex"><span class="x">The box of pens are here.</span><span class="v">The box of pens is here.</span></div><p>each, every, everyone = singular (has, is).</p>`},
{g:',',n:'Comma splice',cn:'逗号误用',h:`<p>A comma alone <b>cannot join two full sentences</b>.</p><div class="ex"><span class="x">It rained, we stayed in.</span><span class="v">It rained, so we stayed in.</span></div><p>Fix with a period, or comma + and / but / so.</p>`},
{g:'…',n:'Half sentences',cn:'不完整句',h:`<p>A <b>because / when / although</b> clause needs a main sentence.</p><div class="ex"><span class="x">Because it rained.</span><span class="v">Because it rained, we stayed in.</span></div><p>Clause first? Put a comma after it, and no capital letter after the comma.</p>`},
{g:'&',n:'Joining words',cn:'连接词',h:`<ul><li><b>and</b> = add</li><li><b>but / however / although</b> = contrast (转折)</li><li><b>so / as a result</b> = result</li><li><b>because / since</b> = reason</li><li><b>or</b> = choice</li><li><b>if</b> = condition · <b>unless</b> = if not</li></ul><div class="ex"><span class="x">I was tired, so I kept working.</span><span class="v">I was tired, but I kept working.</span></div>`},
{g:'or',n:'Word pairs',cn:'固定搭配',h:`<p>These words always come in pairs.</p><div class="ex"><span class="v">either ... or</span><span class="v">neither ... nor</span><span class="v">both ... and</span><span class="v">not only ... but also</span></div><div class="ex"><span class="x">Neither Ana or Tom came.</span><span class="v">Neither Ana nor Tom came.</span></div>`},
{g:':',n:'Colon and list',cn:'冒号',h:`<p>Use a colon <b>after a full sentence</b>, before a list.</p><div class="ex"><span class="x">We need two things milk and eggs.</span><span class="v">We need two things: milk and eggs.</span></div>`},
{g:'ing',n:'Same form in a list',cn:'平行结构',h:`<p>Items in a list use the <b>same form</b>.</p><div class="ex"><span class="x">She likes swimming, to read and baking.</span><span class="v">She likes swimming, reading and baking.</span></div>`},
{g:'its',n:'Sound-alike words',cn:'易混词',h:`<div class="ex"><span class="v">it's = it is · its = belongs to it</span><span class="v">they're = they are · their = belongs to them · there = place</span><span class="v">you're = you are · your = belongs to you</span><span class="v">than = compare · then = time</span></div><p>Test: say "it is" in the sentence. If it works, write <b>it's</b>.</p>`},
{g:"'s",n:'Apostrophes',cn:'所有格',h:`<div class="ex"><span class="v">one dog's bowl</span><span class="v">two dogs' bowls</span><span class="v">the children's coats</span></div><div class="ex"><span class="x">The two dog's bowls are empty.</span><span class="v">The two dogs' bowls are empty.</span></div>`},
{g:'!',n:'Be careful',cn:'注意',h:`<ul><li>In "combine" questions, long "and ... and ... and" answers are usually wrong.</li><li>Pick the short answer with the right logic.</li><li>Read each option as a full sentence in your head.</li><li>Check: have + <b>gone</b> (not went), the <b>funniest</b> (not most funniest), to Maya and <b>me</b>.</li><li>Answer every question. A guess costs nothing.</li></ul>`}
