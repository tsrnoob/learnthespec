const PT=[{"key": "arrow", "sel": "Part A", "title": "Project Arrow", "kind": "News report", "paras": ["[1] On January 5, 2023, the Canadian electric car prototype named Project Arrow was unveiled in the United States. The car was featured at an event showcasing technological innovation. The project began in 2020 when the Automotive Parts Manufacturers' Association launched a competition to design the best model of a zero-emission vehicle. Four students from Carleton University in Ottawa developed the winning concept.", "[2] The next step was to create a prototype of the vehicle. \"We had an exceptionally strong and committed Ontario Tech University team,\" says Paula Ambra, Assistant Chief Engineer for Project Arrow at the Ontario Tech University in Oshawa. As part of the team, a handful of students from the Faculty of Engineering and Applied Science worked long hours. They did this alongside industry professionals and staff from Ontario Tech University while attending university full-time. Izzy Cossarin, a student who worked on the project, loved contributing to the initiative: \"It was the best learning experience. I was able to apply my theoretical engineering knowledge to real-world applications.\"", "[3] When the vehicle was unveiled at a consumer electronics show in Las Vegas, thousands of people from the industry and the media visited the Project Arrow booth. This occurred over the four days of the event. People were intrigued by the project and wanted to know more, according to Ambra.", "[4] For now, this prototype will continue to be shown at events and auto shows around the world, as it demonstrates what Ontario's automotive talent is capable of. Perhaps one day the car will be mass produced, and we'll see it on the roads of the province!"], "credit": "Invest Ontario. Adaptation and reproduction permission granted, Photo: Ontario Tech University."}, {"key": "blake", "sel": "Part B", "title": "Blake Angeconeb", "kind": "Real-life narrative", "paras": ["[1] You wouldn't know by looking at Blake Angeconeb's work that he got a late start in painting.", "[2] Growing up, Angeconeb, who is a member of Lac Seul First Nation in northern Ontario, had little interest in art, and never took any art classes. One afternoon in 2013, he painted a cartoon character with his niece and immediately felt relaxed and impressed with having created something.", "[3] When he started painting at the age of 23, he felt his work looked like that of a little kid, but he took great comfort in painting.", "[4] \"I find art is very relaxing for me,\" said Angeconeb on the podcast Face to Face.", "[5] In 2020, Angeconeb quit his job to focus on painting, something he admits he didn't tell his mom for a few weeks. As his career picked up momentum, his parents became big supporters.", "[6] By 2021, Angeconeb, then 32, was going all-in on a career in art. He was invited to paint a giant mural (16.5 by 4.8 metres) on the wall of the Toronto headquarters of a social media company.", "[7] Angeconeb's art is a mash-up of two passions: video games and contemporary media. He often blends pop culture references like Star Wars or characters from video games with traditional Woodlands art. The colourful Woodlands art style is rooted in traditional stories and images, often exploring the interconnected relationships among humans, animals and plants.", "[8] Renowned Bingwi Neyaashi Anishinaabek First Nation artist Norval Morrisseau is a huge influence on Angeconeb's work. \"He was the artist I really dove into and learned [about], going to the library and reading books about him. Searching online, just really respecting and enjoying his art.... That's the best, when someone will message me and say 'that painting made my day'.... Spreading that good medicine. Anything that can uplift and make someone feel better is the main goal with my art. And that's what I got from Norval's art when I saw it.\""]}, {"key": "para", "sel": "Reading Selection 1", "title": "Paralympic Movement", "kind": "Information paragraph", "paras": ["Canada is recognized worldwide for its participation in the Paralympic Movement—a global sports movement committed to the inclusion of people with disabilities. The Paralympic Games run alongside the Olympic Games and are held immediately following at the same venues. They provide an opportunity for athletes who have trained intensely and pushed the boundaries of human achievement to compete and showcase their athleticism. Athletes compete for medals in a variety of sports, such as wheelchair racing and para swimming. The first edition of this international competition was held in Rome in 1960. Canadian doctor Robert Jackson was a spectator. He was disappointed to see that there was no Canadian team. He made it his mission to include Canadian athletes in the Paralympic Games.", "Eight years later, 25 Canadian athletes participated in the Paralympic Summer Games for the first time. They won 19 medals. In 1976, Canadian athletes participated in the first Paralympic Winter Games in Sweden, winning 4 medals. They have been competing ever since. In Albertville in 2018, Canadian paralympic athletes won 28 medals. More recently, at the Beijing 2022 Paralympic Winter Games, Canada won 25 medals to finish third in the medal standings. Canadian athletes achieved another first at these Games by winning medals in para snowboarding. Through the Athlete Assistance Program, Canada helps pay for various expenses of these athletes. This includes training, equipment and uniforms. In addition, Canada hosted the 1976 Games in Toronto and the 2010 Games in Vancouver. Now when you think of Canada, you can think of its involvement in the Paralympic Movement."]}, {"key": "jay", "sel": "Reading Selection 2", "title": "Jay Odjick: A Comic Book Enthusiast", "kind": "Real-life narrative", "paras": ["[1] When he was young, Jay Odjick dreamt of being a comic book writer and illustrator. This is indeed the career he has pursued. It feeds his passion and promotes his culture and language. Odjick is an artist, author and member of the Kitigan Zibi Anishinabeg Algonquin First Nation near Maniwaki, Quebec. He is the first person to create an Indigenous superhero, named Kagagi, whose origins lie in tradition, stories and traditional knowledge.", "[2] Odjick was born in Rochester, New York, where he lived up the street from a comic bookstore. This was the place where he discovered his passion for comic books. Odjick was attracted to the bright colours and adventures of superheroes. Reading comics not only improved his literacy skills but also cultivated his talent for drawing. At the age of five, he wrote and illustrated his first comic book. It featured an invented character called Arachnid-Man, who looked suspiciously like Spider-Man, his favourite superhero. Odjick admits that it wasn't a very original idea, but it was his first real effort. Around this same time, Odjick's family left the United States. They relocated to his father's home community, the Algonquin reserve of Kitigan Zibi. This event was an important one in Odjick's life.", "[3] Once in Quebec, his fascination for comic books continued. He was inspired by superheroes from movies. While watching a Superman movie with his father, Odjick began to wonder why there weren't any superheroes who looked like him or lived in a community like his own.", "[4] Nearly 20 years later, an Indigenous superhero named Kagagi was born. Created and illustrated by Odjick, Kagagi: The Raven is the story of a young Indigenous teenager who must defeat a legendary character in the Algonquin story. This comic book allows First Nations children to see themselves reflected in this superhero character. The book has been an incredible success. The publisher, Arcana Comics, printed and distributed Odjick's Kagagi: The Raven in three languages: English, Algonquin and French. The comic was also adapted for television in 2014 and broadcast in Canada, the United States and Australia.", "[5] Odjick's success didn't stop with the success of Kagagi. He was invited by Scholastic Canada to illustrate for the famous children's author Robert Munsch. The result was two children's books, Blackflies and Bear for Breakfast. Both books were based on Indigenous life and culture. Odjick even convinced the publisher and Robert Munsch to print bilingual versions of Bear for Breakfast in French-Algonquin and English-Algonquin. It was a proud and joyful moment for Odjick, whose goal has always been to promote his language.", "[6] He admits that he was a bit worried about drawing for Robert Munsch. Unlike typical artists, Odjick constructed his drawings digitally. Replacing paper with a tablet and digital pencil makes his creative process portable and versatile.", "[7] Looking back, Odjick turned his passion for comic books into a lifelong commitment to celebrate and promote his culture. It's a way for him to help his community preserve its language. He has always persevered. If he had given up after receiving his first rejection letter from the publisher of Marvel Comics at the age of ten, he would not have achieved the success he has today. Odjick's advice to anyone pursuing a dream is \"you shouldn't be afraid to pursue your dreams, because a superhero never gives up.\""], "credit": "Written for EQAO."}, {"key": "monarch", "sel": "Reading Selection 3", "title": "Monarch Waystation", "kind": "Dialogue", "paras": ["[1] It was a sunny spring morning. Marcel decided to ride his bike over to his friend Harvinder's house for a visit. When he arrived, he noticed that Harvinder was wandering around her front yard with a shovel and measuring tape.", "[2] \"Hey, Harvinder!\" Marcel called out. \"What are you doing? Calculating the area of your front yard?\"", "[3] Harvinder ambled over, pausing to put down the measuring tape. \"Something like that. I'm planning to create a monarch butterfly waystation, so I'm looking for an open spot that would be large enough.\"", "[4] \"A monarch what? Did you say train station?\"", "[5] Harvinder laughed. \"No—waystation! It's a habitat for monarch butterflies. I need to create a space to plant milkweed. Monarchs only lay their eggs on milkweed plants, and monarch caterpillars need milkweed for food and shelter after they hatch in the spring.\"", "[6] \"Caterpillars and butterflies?\" Marcel shrugged. \"What's the big deal?\"", "[7] \"Did you know that every year, hundreds of millions of monarch butterflies make their way from Canada down to Mexico so they can wait out the winter in a warmer climate? But the yearly monarch migration has been declining because the species' food sources have been gradually disappearing. That's why I'm also planting a variety of flowers for migrating monarch butterflies, so they can rest and eat the nectar they need to survive. Butterflies are so important to our ecosystem. They pollinate all kinds of plant species, let us know if our ecosystem is healthy and even predict environmental change.\"", "[8] \"So you're creating...a restaurant for butterflies!\"", "[9] Harvinder nodded. \"You could say that. With milkweed for breakfast, lavender for lunch, goldenrod for dinner and daisies for dessert! Goodbye, grass! Hello, butterflies!\""], "credit": "Written for EQAO."}, {"key": "inuk", "sel": "Reading Selection 4", "title": "My Inuktitut Computer", "kind": "News report", "paras": ["[1] Leena Tatiggaq Evic is a teacher and artist from Baffin Island, in Canada's Far North. She has been working for nearly a decade to translate basic computer tools into her language. When she sits in front of her computer screen, it's not the words \"print,\" \"file,\" \"folder,\" \"cancel\" or \"save\" that are displayed. What she reads are words like \"Paippaamuurli,\" \"Ini,\" \"Puurvik,\" \"Qujanaarli\" or \"Jagajjairli.\" There is also \"Qamilli\" (turn off), \"Ikiaqqijjut\" (Internet), \"Matuli\" (close) or \"Taima\" (quit).", "[2] \"In 2003, Microsoft offered to translate Windows into Inuktitut,\" says Leena Tatiggaq Evic. She is the founding director of the Pirurvik Centre, whose mission is to protect and promote the culture of the Far North. Today, the approximately 100 000 Inukophones around the world (including more than 30 000 in Canada) can download word-processing applications in their language for free.", "[3] This long and complex journey is supported by the Government of Nunavut. In 2008 they made a commitment to making Inuktitut the language of work, and to ensuring that Inuktitut is taught throughout elementary and secondary education.", "[4] In all, more than one million words had to be programmed in Inuktitut. A terminology committee, made up of several elders and representing the six dialects and 26 official communities of this immense territory spanning three time zones, created a basic glossary that has gradually expanded.", "[5] \"New technologies can be extremely effective tools in the preservation of rare languages. It is very important for young people to see that their language can be broadcast on the Internet or on a cellphone. It makes them feel that it [their language] has value in the modern world,\" says Leena Tatiggaq Evic."], "credit": "By Pascale Millat"}, {"key": "mosq", "sel": "Reading Selection 5", "title": "Mosquitoes", "kind": "Information paragraph", "paras": ["If you've ever felt like you get bitten by mosquitoes more than the average person, it's not your imagination. So why is that? There are several reasons. First, these tiny insects are very attracted to both carbon dioxide, which we all breathe out, and to lactic acid, which some people produce more than others, particularly when they sweat. Female mosquitoes are the only ones who bite, and they do it to provide blood to nourish their eggs. This means that washing off dirt and sweat is your first line of defense. Mosquitoes are also drawn to specific blood types more than others, so if you're type O, then mosquitoes may find you more appealing. They also love flowers, so don't apply floral fragrances if you're spending a lot of time outdoors. Avoid dark clothing during the day—mosquitoes don't have the best eyesight, and the contrast between bright light and dark clothes helps them spot you more easily. If possible, use environmentally friendly repellents, and make sure there's no standing water around you that can serve as a breeding ground for mosquitoes, who lay their eggs in still water. But if, after all precautions, you still get bitten and have become a meal for these tiny buzzing insects, remember that there are a variety of remedies, like calamine lotion and witch hazel, for that dreadful itch. You might even try honey, oatmeal or crushed ice!"], "credit": "Written for EQAO."}, {"key": "rama", "sel": "Reading Selection 6", "title": "Srinivasa Ramanujan", "kind": "Dialogue", "paras": ["[1] A few minutes before math class began, Supriya plunked down into her usual seat beside Carlos.", "[2] \"Hey, partner. Have you thought about who might be the subject of our math project?\" Supriya asked. \"It's due next week.\"", "[3] Carlos frowned. \"I did a quick search for famous mathematicians. Just as you'd expect, Pythagoras, Euclid and Pascal popped up. It would be cool to research someone more obscure.\"", "[4] \"Agreed!\" replied Supriya. \"How about a mathematician we haven't learned much about in class, like Srinivasa Ramanujan?\"", "[5] \"Huh?\" said Carlos as he typed the name into his computer.", "[6] Within seconds, Carlos's eyes widened as he read from the screen.", "[7] \"Ramanujan was a famous mathematician from India who lived from 1887 to 1920. He had no formal training in mathematics. However, he mastered trigonometry by age 12, and by the age of 17, he was developing his own math theorems.\"", "[8] \"I know!\" said Supriya. \"His goal was to study at a university, so he wrote many letters to professors of mathematics. By the age of 20, he was extended an invitation to study at a university in England.\"", "[9] \"This guy could be an interesting subject for our project! How did you get the idea?\" Carlos asked.", "[10] \"From my grandfather, who knew about Ramanujan's work from the film The Man Who Knew Infinity. It shows how Ramanujan's life was very difficult because he was living on the edge of poverty,\" stated Supriya.", "[11] \"Ironic, eh? We will teach our classmates about an autodidact,\" Carlos said.", "[12] \"An auto-what?\" asked Supriya.", "[13] \"Someone who is self-taught,\" laughed Carlos."], "credit": "Written for EQAO."}, {"key": "garden", "sel": "Reading Selection 7", "title": "Community Vegetable Garden", "kind": "Dialogue", "paras": ["[1] Drew cleared his throat and waited for Harpreet to notice him, but she didn't. \"Wow, you're really focused on those seed packets in your hands,\" he said. Harpreet was standing next to a patch of soil. There was a shovel planted in the dirt where she had been digging. Close by, several other people were in the process of excavating their own plots.", "[2] Harpreet looked up and gestured toward the three-metre-long rectangle she had created. \"Hey, Drew! What do you think of my vegetable garden?\"", "[3] \"A vegetable garden? What for?\"", "[4] Harpreet smiled. \"I've always wanted to grow my own vegetables. Last year, I grew tomatoes on the back porch in a big container. It was such a success that we gave two baskets full to our neighbours. This spring, I registered for a space in this community garden to grow even more produce.\"", "[5] Drew looked at the patch of dirt skeptically. \"It doesn't look like much of a garden.\"", "[6] Harpreet chuckled and passed him several colourful seed packets. \"Not yet. But, look! I'm planting yams, cilantro, beans...and tomatoes, of course! Everyone loves those.\"", "[7] \"Not everyone! I prefer cucumbers, but I am interested in this idea of being self-sustaining. How would I even know where to start?\"", "[8] \"You could start by planting some cucumber seeds in a container on your balcony or you could apply for a space here. There are still some available. The best part is, at the end of the summer, everyone shares what they've grown.\"", "[9] \"Fresh air, fresh vegetables and a community garden party? I'll apply right away!\""], "credit": "Written for EQAO."}, {"key": "runner", "sel": "Reading Selection 8", "title": "Sight-Impaired Runner Blazes New Trail", "kind": "News report", "paras": ["[1] With sweat drenching his jersey after completing a gruelling five-kilometre cross-country race, 14-year-old Ka Li had just enough energy left to smile and declare himself satisfied with his accomplishment.", "[2] Li is legally blind, but that didn't stop him from trail running. \"There was a time when I wondered how far I could go, but I'm not a quitter. When I heard the encouragement of people cheering me on, just as I was about to climb a big hill, it gave me a huge lift. It's been quite an accomplishment, my first high school race, and I feel like a winner for competing and finishing.\"", "[3] \"It was a big challenge—lots of stones and I could have easily tripped—but I feel great,\" said Li, who used schoolmate William Cornish to guide him through the run at Boyd Conservation Area in Woodbridge, Ontario.", "[4] Li can see shadows but no detail and requires a white cane—an aid used by people living with sight loss—to navigate. He is finalizing paperwork to apply for a guide dog.", "[5] Li, who admits he spends lots of time on the computer thanks to assistive technology, said, \"My parents thought I should take up a sport and get active.\"", "[6] Distance running wasn't his first foray into the world of sport. \"I tried wrestling, judo and some rock climbing, but this is by far the best for me,\" he says.", "[7] \"I used to hear... people talk about me being blind and feeling sorry. But I ignored it. My lifestyle is different from other kids my age..., but I can push myself and like doing what everyone else does.\""], "credit": "By David Grossman"}, {"key": "bryt", "sel": "Reading Selection 9", "title": "Brytnee Brough: My Identity, My Heritage", "kind": "Real-life narrative", "paras": ["[1] My name is Brytnee Brough and I am Kanyen'keha:ka (this is how we say Mohawk in the Mohawk language). The Kanyen'keha:ka are an Indigenous people who live in the territory we know today as Ontario and Quebec in Canada, and New York State in the United States.", "[2] The Kanyen'keha:ka are divided into eight communities, which we also call reserves, that have a vibrant culture, and even their own language! But me, I've always lived outside my Indigenous community, called Tyendinaga, which is located in the Belleville region of Ontario. I grew up in southwestern Ontario and consider myself an urban Indigenous person.", "[3] Living outside our Indigenous community can pose certain challenges. For example, I didn't always have access to my culture, and I didn't learn Kanyen'kéha as my first language. However, I have had other opportunities, such as learning French at school and participating in cultural activities at the Friendship Centre with other Indigenous youths from various nations. The Friendship Centre is an important place for urban Indigenous peoples. It's a place where we can celebrate our cultures and access services as if we were in our home communities.", "[4] It is the sum total of my experiences that defines my identity. Despite the fact that my culture and language have not always been accessible, I have still succeeded in learning many of our histories, traditions and cultural practices by reconnecting with my community. For example, I learned to bead using tiny beads and animal hide. I've even started my own business selling beaded items such as earrings, necklaces and moccasins. The art of beading is practised by Indigenous people all over Turtle Island (that's what North America is called), and I am very proud to have developed this talent!", "[5] In addition, for the past few years I have been working hard to reclaim my family language. In 2020, I started taking online Kanyen'kéha language courses. I was very excited to start the first course, but I was a little nervous since I had very little knowledge of the language. Fortunately, since I already spoke French, I found it quite easy to learn the basic rules of Kanyen'kéha, as the sounds are quite similar! Even though, in my opinion, the Kanyen'kéha language is much more complicated and does not follow the same sentence structures or grammar as French, I successfully learned to communicate using simple sentences.", "[6] Knowing my language is very important to me since there aren't many people who speak it, and it is in danger of disappearing. The latest census shows that it is spoken by only 3000 people in the world, most of them elderly people. Knowing your language gives you a better understanding of your nation's history and culture. If we stop speaking our language, we risk losing the richness of our culture. I am very proud to be who I am. I am a member of a First Nation from the Mohawk Nation and a French speaker of southwestern Ontario. I am grateful to all the people who have helped shape my identity. I hope one day to be able to pass on my knowledge and help young people, like me, on their own identity journey."]}, {"key": "authors", "sel": "Reading Selection 10", "title": "Black Authors' Panel", "kind": "Dialogue", "paras": ["[1] \"Marcus, did you hear about the Black authors' panel that was mentioned in the school announcements this morning? As the president and vice-president of student council, we should present a list of potential authors to the organizing committee by the end of the week,\" said Dylan.", "[2] \"I did. What a great opportunity to highlight Black writers!\" exclaimed Marcus.", "[3] Dylan grabbed his tablet from his backpack to show Marcus his list.", "[4] \"Wow! You've already started? There are so many authors to choose from!\"", "[5] \"I did get started! I think we should focus on Black Canadian authors since we are talking about representation. Canada has so much history, so many stories and so much culture to explore and learn from,\" Dylan replied.", "[6] Marcus took another look at the list and searched the Internet for a few of the authors. \"I think it would be great to showcase authors like Harrison Mooney, Ben Philippe, Francesca Ekwuyasi or Liselle Sambury. Who did you have in mind?\" he asked.", "[7] \"I really like Harrison Mooney. We share some similar experiences. Also, he is a best-selling memoirist, award-winning journalist, public speaker, educator and activist from the west coast,\" said Dylan.", "[8] \"Similar experiences? Like what? Hmm... now I'm curious to learn more about you.\"", "[9] Dylan chuckled. \"One day at a time, my friend. In the meantime, is our list complete?\""], "credit": "Written for EQAO."}, {"key": "gum", "sel": "Reading Selection 11", "title": "Chewing Gum", "kind": "Dialogue", "paras": ["[1] Every Saturday morning, Veronique and her cousin Matthieu go for a walk near their home.", "[2] \"Oh no! I just stepped on some sticky gum again! It's disgusting!\" says Veronique.", "[3] \"I know what you mean,\" says Matthieu, \"It brings back memories of my job at the convenience store last summer. I had to remove the gum that was stuck everywhere on the sidewalk in front of the store.\"", "[4] \"People don't realize that chewing gum doesn't break down completely and is bad for the environment. Did you know that in Singapore it is illegal to consume gum, because people were disposing of it all over the place?\" says Veronique.", "[5] \"It's a good initiative, but I don't know if it would work here. The sale of chewing gum is a major source of revenue. I've heard that people in North America spend billions of dollars a year on gum of all kinds,\" adds Matthieu.", "[6] \"All that money on gum? That's a lot of money,\" says Veronique. \"How can we promote awareness of the impact of gum on the environment?\"", "[7] \"Can we do this on Earth Day?\" suggests Matthieu.", "[8] \"Yes, we could organize activities where we make students aware of the lifespan of waste—not only chewing gum, but of everything buried in the ground,\" suggests Veronique.", "[9] \"That's a great idea!\" says Matthieu. \"I'm curious to know how long it takes chewing gum to decompose once it's in the ground,\" he states.", "[10] \"Five years,\" sighs Veronique, \"and after all that time, we're not even sure it's completely decomposed.\"", "\"How horrible!\" exclaims Matthieu. \"Let's hurry up... [the rest is cut off in the screenshot]"]}, {"key": "museum", "sel": "Reading Selection 12", "title": "Canadian Language Museum", "kind": "News report", "paras": ["[1] From November 2 to December 7, 2021, the Canadian Language Museum, located on the Glendon Campus of York University in Toronto, presented an exhibit featuring six sign languages used in Canada, including those developed by Indigenous peoples: Plains Sign Language, Inuit Sign Language and Oneida Sign Language.", "[2] This event was organized by Elaine Gold, executive director of the museum, who worked closely with four students from the University of Toronto. It took visitors about 30 minutes to absorb the seven informative displays. In addition, museum visitors could watch videos by using a QR (quick response) code or consult the museum's library, which is rich in children's books and dictionaries on Indigenous languages. The museum also has rare pieces, including a card game to learn Inuit Sign Language.", "[3] \"Coming to the museum means discovering much more than just the exhibit,\" explains Lyse Hébert, a professor at the School of Translation, Glendon College.", "[4] One of the special features of this exhibit was the focus on the sign languages specific to Indigenous peoples. Among the Inuit, sign language emerged at least 100 years ago. However, despite the fact that some 150 Inuit communicate with sign language, it is in danger of extinction. In the Canadian Prairies, Plains Sign Language is used by some 50 people from many groups, including the Blackfoot, Dakota, Cree and Assiniboine.", "[5] The sign languages of Indigenous peoples, which originated long ago, were utilized by both individuals with hearing loss and those who could hear. Signing was a practical means of communication among communities who spoke different languages. For this reason, Indigenous communities are organizing to save and revitalize their sign languages."], "credit": "By Clément Lechat. Adapted from \"À la découverte des langues des signes du Canada\", published on l-express.ca, November 19, 2021."}, {"key": "fashion", "sel": "Reading Selection 13", "title": "Accessible Fashion", "kind": "Information paragraph", "paras": ["The fashion industry has often ignored the needs of people with disabilities. However, accessibility is important for some fashion designers. People with various disabilities or medical conditions who do not have access to wearable clothes can find going out in public extremely limiting. Accessible fashion allows people of all abilities to interact in the world and to express themselves through their clothing choices. Accessible clothing is easier to put on and take off. It includes features like adjustable straps, one-handed zippers, elastic shoelaces, magnetic and Velcro closures, and elastic waistbands. Toronto designer Izzy Camilleri has designed clothing for wheelchair users. Her jackets split in half, so there is no need to reach behind the body. The centre back seam has also been removed from pants. These seams can cause pressure sores for people sitting for a long time. Camilleri has won recognition around the world for her clothing. The accessible clothing she creates blends beauty and functionality. Another Canadian designer, Alexa Jovanovic, is the founder of Aille (pronounced \"eye\") Design. Her designs include braille beading. The raised crystals in her first designs indicated colour and care instructions. The beads are also used to spell out messages of inspiration in braille. The goal is full inclusivity. Adaptive clothing is meant to be sold alongside mainstream clothing. Other innovative designers continue to create pieces that raise awareness, challenge stereotypes and push boundaries. These designers believe accessible clothing could allow for greater independence, dignity and personal expression."], "credit": "Written for EQAO."}, {"key": "siakam", "sel": "Reading Selection 14", "title": "Pascal Siakam", "kind": "Real-life narrative", "paras": ["[1] The journey of Pascal Siakam, a basketball player born in Douala, Cameroon, has been far from ordinary. To begin with, unlike many children, he was not interested in basketball. Rather, his favourite sport was soccer. He did not swap the black and white ball for the orange until the age of 16, a change that delighted his father and brothers, all of whom were keen fans of basketball. Despite being a late starter in the sport, his natural talent proved to be remarkable.", "[2] In 2011, he caught the eye of recruiters when he took part in the \"Basketball Sans Frontières\" summer camp. From there, he went on to South Africa alongside other talented young players to undergo a special training program. His performance earned him a university scholarship. He then flew to the United States, where he focused on his studies and his new-found sport. He later joined the New Mexico State University team.", "[3] Pascal trains constantly to improve his performance on the court. For two years, he gained experience with the university team. He was then drafted by an NBA team in 2016. This time, the Cameroonian flew to Toronto to join the Raptors. Still, in his first year with them, he spent more time on the bench than on the court, playing just five times! However, whenever he was given the ball, he showed his skill and intensity. Pascal is a master of the game, on both offense and defence. His speed is one of his greatest strengths, and one that surprises many.", "[4] In the spring of 2019, the forward helped his team reach the final and win its first NBA championship. Fans across Canada celebrated this historic victory in style. Throughout the season, Pascal Siakam broke records. He scored more than 30 points in a final. He was the youngest player to achieve this in a finals debut since 2012. His best season came in 2022–2023, when he played more minutes per game than any other NBA player. He also averaged 24.3 points per game, one of the highest totals ever for the Raptors. In January 2024, he was traded to the Indiana Pacers.", "[5] Not only was the player in the news for his jumping ability and his shots at the basket, his use of his first language had caught the attention of the media and basketball fans. During an interview, Pascal Siakam asked that questions be put to him in French, which prompted a wave of pride among francophones in Canada and elsewhere. Indeed, the star values the French language. Another cultural element that is close to his heart? His Cameroonian origins. He wants to be a positive role model for young people, particularly young Africans.", "[6] When interviewed by journalists about his success, Pascal is quick to mention his personal investment and the hard work he puts in to become better. But he also admits that, as a latecomer to the sport, he always has something to learn. This gives him the motivation to train and excel."], "credit": "Written for EQAO."}, {"key": "budget", "sel": "Reading Selection 15", "title": "Vanessa and Samirah", "kind": "Dialogue", "paras": ["[1] Vanessa and Samirah talk about their jobs after class. They work in a store every weekend.", "[2] \"I can't wait for Thursday; it's payday,\" says Samirah.", "[3] \"Do you have any plans for your paycheque?\" inquires Vanessa.", "[4] \"Yes, quite a few! A pizza dinner with my cousins, new sandals, a video game and...\"", "[5] \"That will cost you a lot!\"", "[6] \"I pay my cellphone bill too! I spend my entire paycheque every time, Vanessa. Don't you? That's why we work, right?\"", "[7] \"No, I try not to. I'm saving up to buy a new laptop. It's not easy, but I'll manage,\" asserts Vanessa.", "[8] \"Really? How are you doing it? I always thought it was complicated. I never seem to be able to save my money...\"", "[9] \"In my math class, Mr. Ibrahim taught us how to make a balanced budget. You have to divide your income into categories. I'm saving 45% of my wages for my post-secondary education. That's my long-term project. In the medium term, I save 35% for major expenses like my computer. In fact, I've calculated the cost of my computer, including sales tax. Soon, I'll have the money to buy it. The remaining 20% of my paycheque is for short-term purchases, like pizza or hair products.\"", "[10] \"That's great! Prioritizing is a win-win situation.\"", "[11] \"Absolutely, but making savings a priority some months is so difficult, especially when unexpected expenses come up,\" adds Vanessa. \"I also bring my own lunch and buy clothes on sale to cut back on spending. If you want, I can help you review your priorities and set a budget.\"", "[12] \"Yes, please! I was just wondering how I could save up for a bicycle,\" responds Samirah."], "credit": "Written for EQAO."}, {"key": "aurora", "sel": "Reading Selection 16", "title": "Aurora Borealis", "kind": "Dialogue", "paras": ["[1] The sun had long set, and the Boucher family gathered at the shore of the frozen lake. Siblings Giles and Noreen approached their dad, who gazed upward at the flickering night sky as it swirled with a dazzling array of colours.", "[2] \"What a sight!\" Giles exclaimed. \"Our last night here at the top of the world capped off with a beautiful display of aurora borealis.\"", "[3] \"You mean the northern lights?\" Noreen said.", "[4] \"The scientific name is aurora borealis,\" explained Giles, reading from a scientific website on his phone. \"What we see are flashes of colour, which are actually collisions between electrically charged particles from the sun that enter the earth's atmosphere—\"", "[5] \"Where they collide with gases,\" Noreen interjected. \"I know, I know. Dad quizzed us on this last night, remember? But it's not just science. I prefer a more poetic version. According to one Ojibwe legend, the northern lights were created by the Ojibwe's cultural hero Nanabozho, who lit large fires in the sky so that his people would know that he was always with them.\"", "[6] \"That's a beautiful image,\" Giles said as he looked back and forth from his phone to the sky, and then he added, \"But science explains that the different atmospheric gases create the colours. Green or red flashes mean the solar particles are mixing with oxygen, and purple or blue flashes mean the particles are mixing with nitrogen.\"", "[7] \"It's spectacular,\" Noreen said. \"We came outside just in time!\"", "[8] \"I'll take some credit for that,\" their dad remarked. \"Just like the weather, the aurora borealis can be forecast. By measuring geomagnetic activity in a given region, the odds of seeing aurora borealis on a given night can be predicted.\"", "[9] \"And I predict we'll be quizzed about that tonight at dinner!\" quipped Giles."], "credit": "Written for EQAO."}];

const RTIPS=[
{g:'★',n:'Main idea',cn:'主旨大意',h:`<p>The main idea covers the <b>whole text</b>. A detail covers only one part.</p><div class="ex"><span class="x">Canada has hosted two Games. (one detail)</span><span class="v">Canada is well-known for taking part in the Games. (whole text)</span></div><p>Read the first and last sentences again. The best title says the main idea too.</p>`},
{g:'Aa',n:'Word meaning',cn:'词义和指代',h:`<p>Put each choice into the sentence. Keep the one that still makes sense.</p><div class="ex"><span class="v">ambled over = walked over</span><span class="v">a gruelling race = a difficult race</span></div><p>For <b>it / they / this</b>, look back one sentence. The word points to something just named.</p>`},
{g:'( )',n:'Punctuation clues',cn:'标点的作用',h:`<ul><li><b>...</b> = a pause, or a thought that is not finished</li><li><b>!</b> = strong feeling (excited, surprised)</li><li><b>:</b> in a title = title, then subtitle</li><li><b>—</b> = joins or adds an idea</li><li><b>( )</b> = extra explanation</li></ul>`},
{g:'→',n:'How it is organized',cn:'文章结构',h:`<ul><li><b>Problem and solution</b>: something is wrong, then ways to fix it</li><li><b>Cause and effect</b>: because, so, that is why</li><li><b>Events in a sequence</b>: dates, then, later</li><li><b>Term and explanation</b>: a new word, then what it means</li></ul><p>To put events in order, find each one's date or age in the text.</p>`},
{g:'T/F',n:'True, false, fact, opinion',cn:'判断题',h:`<p><b>True</b> only if the text says it. Do not use what you already know.</p><div class="ex"><span class="x">Waystations should include only local plants.</span><span class="v">Watch for: only, all, always, never.</span></div><p><b>Fact</b> = can be checked. <b>Opinion</b> = what someone thinks (should, best, great).</p>`},
{g:'✎',n:'Written answer',cn:'简答题',h:`<p>About 100 words. Four steps:</p><ul><li>Answer the question in your <b>first sentence</b>.</li><li>Give <b>two or three details</b> from the text.</li><li>Say how each detail supports your answer.</li><li>End with one closing sentence.</li></ul>`}
];

function openMenu(){const qs=SETS[Q.k];let h='',last=null;
 Q.order.forEach((id,j)=>{const q=qs[id],g=q.ps!=null?PASS[q.ps].title:(mixes(Q.k)?'':q.g||'');
  if(j===0||g!==last){h+=(j?'</div>':'')+(g?`<p class="mh">${esc(g)}</p>`:'')+'<div class="mg">';last=g}
  h+=`<button class="dot ${stateOf(id)} ${j===Q.i?'cur':''}" data-go="${j}">${j+1}</button>`});
 MENU.hidden=false;MENU.innerHTML=`<div class="sheet menu" role="dialog" aria-modal="true" aria-label="Question list"><div class="top"><h3 style="margin:0;flex:1">Questions</h3><button class="x-btn" id="mclose" aria-label="Close list">✕</button></div>${h}</div>
 <p class="leg"><span class="dot done"></span> answered <span class="dot ok"></span> correct <span class="dot no"></span> wrong</p>
 <button class="go" id="finish">Finish and see score</button><button class="go ghost" id="restart" style="margin-top:10px">Start over 重新开始</button></div>`;
 const s=MENU.firstChild;s.style.transform='translateY(-20px) scale(.96)';s.style.opacity='0';requestAnimationFrame(()=>{MENU.classList.add('on');s.style.transform='none';s.style.opacity='1'})}
function closeMenu(){MENU.classList.remove('on');MENU.hidden=true;MENU.innerHTML=''}
MENU.addEventListener('click',e=>{const b=e.target.closest('button');if(e.target===MENU||(b&&b.id==='mclose')){closeMenu();return}if(!b)return;
 if(b.dataset.go!=null){closeMenu();go(+b.dataset.go)}else if(b.id==='finish'){closeMenu();results()}else if(b.id==='restart'){closeMenu();start(Q.k,false,Q.ps);window.scrollTo(0,0)}});
function results(){const qs=SETS[Q.k];let right=0,n=0;
 const rows=Q.order.map((id,j)=>{const q=qs[id],a=Q.ans[id],head=`<b>${j+1}.</b> <span class="rq">${esc(q.q.split('\n')[0])}</span><br>`;
  if(q.t==='open')return `<div class="rv">${head}${words(a)?`<span class="mine">${br(a)}</span><br>`:''}<small>${q.sample?'Sample answer':'A strong answer could include'} (not scored)</small><br><span class="v">${br(correctText(q))}</span></div>`;
  n++;const ok=isRight(q,a);if(ok)right++;
  return `<div class="rv ${ok?'':'no'}">${head}${ok?'':`<span class="x">${br(yourText(q,a))}</span><br>`}<span class="v">${br(correctText(q))}</span><br><small>${esc(q.r)}${q.z?`<br><span lang="zh">${esc(q.z)}</span>`:''}</small></div>`}).join('');
 const p=n?Math.round(right/n*100):0,key=Q.k+(Q.ps!=null?':'+Q.ps:'');Q.done=true;
 if(n&&(!best[key]||right>=best[key][0])){best[key]=[right,n];try{localStorage.setItem('osslt-best',JSON.stringify(best))}catch(e){}}
 A.className='';
 A.innerHTML=`<div class="res"><h1>${p>=80?'Great work!':p>=60?'Good progress':'Keep practising'}</h1><div class="ring" style="--p:${p}"><span>${right}/${n}</span></div>
 <button class="go" id="again">Try again${mixes(Q.k)?' (new order)':''}</button><button class="go ghost" id="quit">${Q.k==='pdfr'?'Back to the texts':'Back to home'}</button>
 <h2 style="align-self:flex-start">Review</h2><div class="rev">${rows}</div></div>`;window.scrollTo(0,0)}
A.addEventListener('change',e=>{if(e.target.id==='exam')exam=e.target.checked});
A.addEventListener('input',e=>{if(!Q||!e.target.classList||!e.target.classList.contains('ta'))return;Q.ans[Q.order[Q.i]]=e.target.value;const w=document.getElementById('wc');if(w)w.textContent=words(e.target.value)+' words'});
A.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.nav==='texts'){texts();return}
 if(b.dataset.text!=null){start('pdfr',false,+b.dataset.text);window.scrollTo(0,0);return}
 if(b.dataset.set){start(b.dataset.set,false);window.scrollTo(0,0);return}
 if(b.dataset.tile){openTile(+b.dataset.tile);return}
 if(b.id==='home'){home();window.scrollTo(0,0);return}
 if(b.id==='reset'){if(!b.dataset.sure){b.dataset.sure=1;b.className='go bad';b.textContent='Tap again to reset 再点一次确认';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.className='go ghost';b.textContent='Reset all progress 重置进度'}},4000);return}
  seen={};best={};try{localStorage.removeItem(SEEN);localStorage.removeItem('osslt-best')}catch(e){}home();window.scrollTo(0,0);return}
 if(b.id==='unseen'){seen={};try{localStorage.removeItem(SEEN)}catch(e){}home();return}
 if(b.id==='quit'){leave();return}
 if(!Q)return;
 if(b.id==='again'){start(Q.k,true,Q.ps);window.scrollTo(0,0);return}
 if(b.id==='burger'){openMenu();return}
 if(b.id==='up'){go(Q.i-1);return}
 if(b.id==='down'){go(Q.i+1);return}
 const id=Q.order[Q.i],q=SETS[Q.k][id];
 if(b.dataset.o!=null){const j=+b.dataset.o;if(q.t==='multi'){let a=Q.ans[id]||[];a=a.includes(j)?a.filter(x=>x!==j):a.length<q.a.length?[...a,j]:a;Q.ans[id]=a}else Q.ans[id]=j;quiz(false);return}
 if(b.dataset.b!=null){const a=Q.ans[id]||[];a[+b.dataset.b]=+b.dataset.j;Q.ans[id]=a;quiz(false);return}
 if(b.dataset.r!=null){const a=Q.ans[id]||q.rows.map(()=>null);a[+b.dataset.r]=+b.dataset.j;Q.ans[id]=a;quiz(false);return}
 if(b.dataset.k!=null){const a=Q.ans[id]||slots(q).map(()=>null),i=Q.act!=null&&a[Q.act]==null?Q.act:a.findIndex(x=>x==null);if(i<0)return;a[i]=+b.dataset.k;Q.act=null;Q.ans[id]=a;quiz(false);return}
 if(b.dataset.s!=null){const a=Q.ans[id]||slots(q).map(()=>null),i=+b.dataset.s;a[i]=null;Q.act=i;Q.ans[id]=a;quiz(false);return}
 if(b.id==='check'){Q.chk[id]=true;quiz(false);return}
 if(b.id==='next'){if(Q.i<Q.order.length-1)go(Q.i+1);else results()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!VEIL.hidden)closeTile();else if(!MENU.hidden)closeMenu();return}
 if(e.target&&e.target.matches&&e.target.matches('textarea,input'))return;
 if(!Q||Q.done||!VEIL.hidden||!MENU.hidden)return;
 if(e.key==='Enter'){const g=A.querySelector('.foot .go:not(:disabled)');if(g){e.preventDefault();g.click()}}
 else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();go(Q.i-1)}else if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();go(Q.i+1)}
 else if(/^[1-5]$/.test(e.key)){const o=A.querySelector(`.opt[data-o="${e.key-1}"]:not(:disabled)`);if(o)o.click()}});
home();
</script>
</body></html>
